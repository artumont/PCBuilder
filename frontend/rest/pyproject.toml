version = "1"
description = "Rest api made to interact with backend, will be used by 'pcbuilder_frontend_next'"
authors = [
    {name = "artumont", email = "197291181+artumont@users.noreply.github.com"},
]
dependencies = ["fastapi>=0.115.8", "logging>=0.4.9.6", "uvicorn>=0.34.0", "datetime>=5.5"]
